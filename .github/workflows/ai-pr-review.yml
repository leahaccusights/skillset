# Managed by the SOC 2 dependency-audit workstream
name: AI PR review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  review:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - name: Checkout
        if: env.HAS_KEY == 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Claude PR review
        if: env.HAS_KEY == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request for:
            - Business-logic correctness
            - SQL injection vectors
            - Unhandled edge cases
            - N+1 queries

            Ignore style and formatting.
            Flag anything that touches authentication, payments or data deletion.

            Read the change with `gh pr diff` and `gh pr view`, then post your findings
            as one PR comment with `gh pr comment`. Give every finding a severity of
            Critical or Warning, with the file and line it applies to.
          claude_args: '--allowed-tools "Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"'
